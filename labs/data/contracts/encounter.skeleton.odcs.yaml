# The shared encounter contract of the Rimah Health Data Consortium: the skeleton for Lab 1.2.
# Open Data Contract Standard (ODCS) v3.2.0. Synthetic case; no real organisation.
apiVersion: v3.2.0
kind: DataContract
id: rimah-encounter
name: Encounters for the readmission study
version: 0.1.0
status: draft
domain: readmission-study
dataProduct: rimah-study-feed
description:
  purpose: One row per hospital stay from every producer, pooled for the 30-day readmission study.
  limitations: Identity fields do not travel in this feed; patients are linked by the keyed pseudonym of Lab 1.3.
  usage: Read by the consortium's preparation pipeline only.
schema:
  - name: encounter
    physicalType: table
    description: One hospital stay, from admission to discharge.
    properties:
      - name: encounter_id
        logicalType: string
        required: true
        primaryKey: true
        description: The producer's own encounter identifier, kept as text.
      - name: patient_local_id
        logicalType: string
        required: true
        classification: restricted
        description: The producer's medical record number; linked across producers only through the pseudonym.
      - name: birth_date
        logicalType: date
        required: true
        classification: restricted
      - name: sex
        logicalType: string
        required: true
        description: M or F.
      - name: admit_date
        logicalType: date
        required: true
      - name: discharge_date
        logicalType: date
        required: true
      - name: ward
        logicalType: string
        required: true
        description: MED, SURG, CARD, ICU or OBS.
      - name: primary_dx
        logicalType: string
        required: true
        description: ICD-10 code in upper case with the dot after three characters (I50.9).
      - name: disposition
        logicalType: string
        required: true
        description: HOME, TRANSFER, DIED or LAMA (left against medical advice).
      - name: weight_kg
        logicalType: number
        required: false
        description: Body weight in kilograms.
      - name: creatinine_umol_l
        logicalType: number
        required: false
        description: Serum creatinine at admission in micromoles per litre.
slaProperties:
  - property: latency
    value: 2
    unit: d
    description: The newest admission in a delivery is at most two days older than the delivery.
  - property: frequency
    value: 1
    unit: d
team:
  name: Rimah data preparation
  members:
    - username: yousra.aldahmash
      role: Contract owner
    - username: atiyah.almaghlouth
      role: Consumer (readmission study)
customProperties:
  - property: producers
    value:
      SDR:
        columns: {encounter_id: encounter_id, patient_local_id: patient_id, birth_date: birth_date, sex: sex,
                  admit_date: admit_date, discharge_date: discharge_date, ward: ward, primary_dx: primary_dx,
                  disposition: disposition, weight_kg: weight_kg, creatinine_umol_l: creatinine_umol_l}
      UFQ:
        columns: {encounter_id: EncounterNo, patient_local_id: MRN, birth_date: DOB, sex: Gender,
                  admit_date: AdmissionDate, discharge_date: DischargeDate, ward: Department,
                  primary_dx: DiagnosisCode, disposition: DischargeStatus, weight_kg: WeightKg,
                  creatinine_umol_l: Creatinine_mgdl}
        date_formats: {birth_date: "%d/%m/%Y", admit_date: "%d/%m/%Y", discharge_date: "%d/%m/%Y"}
      RWD:
        columns: {encounter_id: enc_id, patient_local_id: pt_id, birth_date: dob, sex: sex, admit_date: adm_dt,
                  discharge_date: dis_dt, ward: unit, primary_dx: icd10, disposition: disp, weight_kg: weight_lb,
                  creatinine_umol_l: creat_umol}
        date_formats: {birth_date: "%Y%m%d"}
