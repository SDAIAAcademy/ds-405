<section>
<h2>Day 1: Contract the producers</h2>
<ol>
<li><p>All three producers' weight columns pass "a number between 1 and 500". What do you do before pooling them?</p><ul><li><b>A.</b> Pool them: the rule passed for every producer</li><li><b>B.</b> Divide Rawdah's values by 2.2 in the study notebook</li><li><b>C.</b> Compare the distributions by producer and confirm the unit with each producer</li><li><b>D.</b> Drop weight from the study</li></ul></li>
<li><p>Ufuq confirms its creatinine is in mg/dL. Where should the factor 88.42 be written?</p><ul><li><b>A.</b> In the contract, as a unit clause for Ufuq's creatinine</li><li><b>B.</b> In the preparation pipeline's cleaning step</li><li><b>C.</b> In Ufuq's hospital system, by changing its unit</li><li><b>D.</b> In the study's analysis notebook, with a comment</li></ul></li>
<li><p>Ufuq offers to send SHA-256 of each national identifier instead of the identifier. What do you answer?</p><ul><li><b>A.</b> Accept: hashed data is anonymous</li><li><b>B.</b> Accept if they remove spaces first</li><li><b>C.</b> Ask for the plain identifier and hash it centrally</li><li><b>D.</b> Ask for a keyed hash of the normalised identifier, with a project key the consortium does not hold</li></ul></li>
<li><p>Rawdah plans to rename weight_lb to weight and send kilograms. Its engineer calls it a minor clean-up. How do you classify it?</p><ul><li><b>A.</b> Minor: one column, same data</li><li><b>B.</b> Breaking: a rename and a unit change; major version, notice and a parallel run</li><li><b>C.</b> Additive: the new unit is better</li><li><b>D.</b> Whatever Rawdah decides: it owns the data</li></ul></li>
<li><p>Sidra's creatinine median is 89.9 and Ufuq's is 1.00. Both columns are numeric and complete. What is the most likely explanation, and what follows?</p><ul><li><b>A.</b> Ufuq's patients have healthier kidneys; pool the values as they are</li><li><b>B.</b> Ufuq reports mg/dL; confirm with Ufuq and write the factor 88.42 into the contract</li><li><b>C.</b> One of the columns is corrupt; drop creatinine from the study</li><li><b>D.</b> The medians differ by chance; compare means instead</li></ul></li>
<li><p>Rawdah's diagnosis codes look like i50.9 and Ufuq's like I509. A colleague joins all three extracts to a diagnosis lookup on the raw code. What happens?</p><ul><li><b>A.</b> The join fails with an error, so the problem is found at once</li><li><b>B.</b> Only codes in the lookup's exact format match, so most Ufuq and Rawdah rows drop out silently</li><li><b>C.</b> The database ignores case and dots, so all rows match</li><li><b>D.</b> Every row matches, some to the wrong diagnosis</li></ul></li>
<li><p>Ufuq's latest delivery passes every column rule, but its newest admission is nine days before the delivery date. The contract allows two. What should the gate do?</p><ul><li><b>A.</b> Block the delivery and ask Ufuq to send a complete extract again</li><li><b>B.</b> Accept it: every row is valid</li><li><b>C.</b> Accept it and fill the missing days with the average of earlier days</li><li><b>D.</b> Accept it and note the gap in the study's limitations</li></ul></li>
<li><p>Which clause belongs in the shared contract rather than in one consumer's pipeline code?</p><ul><li><b>A.</b> The colour scheme of the study's dashboard</li><li><b>B.</b> The study's model settings</li><li><b>C.</b> Ufuq's mapping of discharge codes 1 to 4 onto HOME, TRANSFER, DIED and LAMA</li><li><b>D.</b> The name of the notebook that reads the feed</li></ul></li>
<li><p>Producers will send HMAC-SHA-256 of the normalised national identifier. Who should hold the key?</p><ul><li><b>A.</b> The consortium's analysts, so they can check matches</li><li><b>B.</b> Nobody: generate it once and delete it</li><li><b>C.</b> Each producer its own key</li><li><b>D.</b> A linkage unit outside the analysis team, which gives the producers one key for this project</li></ul></li>
<li><p>Adding a second linkage key on name, birth date and sex raised recall from 0.993 to 1.000 and lowered precision from 1.000 to 0.988. What should you report?</p><ul><li><b>A.</b> Only the recall: the study needs every readmission</li><li><b>B.</b> Both numbers with counts: 14 pairs recovered, 24 strangers merged, and a proposed rule to filter them</li><li><b>C.</b> Only precision: wrong links are unacceptable</li><li><b>D.</b> Neither: the truth file is synthetic, so the numbers mean nothing</li></ul></li>
<li><p>Ufuq replaces column Creatinine_mgdl by Creatinine, whose median is 89.3 where the old one was 1.00. How does the policy classify it?</p><ul><li><b>A.</b> Additive: a new column appeared</li><li><b>B.</b> No change: the same measurement under a clearer name</li><li><b>C.</b> Breaking: a renamed column and a unit change; a new major version</li><li><b>D.</b> Breaking only if the data protection officer objects</li></ul></li>
<li><p>Why is a new value in a closed code set (Ufuq's discharge code 5) treated as breaking?</p><ul><li><b>A.</b> The study's mapping does not know it, so those rows become null or drop out</li><li><b>B.</b> Any change to a producer's system is breaking</li><li><b>C.</b> New codes always mean worse data quality</li><li><b>D.</b> It is not: new values are always additive</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Prepare at scale</h2>
<ol>
<li><p>Rawdah tells you that from next month its weight column will hold kilograms, under the same name. What do you do first?</p><ul><li><b>A.</b> Classify it under the policy as a breaking unit change: new major version, notice, a parallel run</li><li><b>B.</b> Thank them and remove the unit clause from the contract the same day</li><li><b>C.</b> Add an if-statement on the date in the study's pipeline</li><li><b>D.</b> Nothing: the range rule will catch any problem</li></ul></li>
<li><p>Your lazy query on the lake is fast but its peak memory is the same as the eager script's. Which change most likely helps?</p><ul><li><b>A.</b> Rewrite the lake as one unpartitioned Parquet file, so fewer files are opened</li><li><b>B.</b> Run it on more CPU cores</li><li><b>C.</b> Collect the labs table first, then filter it</li><li><b>D.</b> Read the plan: put the month and test filters on the scan and select only needed columns</li></ul></li>
<li><p>Sidra's delivery on day 5 corrects results first delivered on day 2. Which load leaves exactly one row per result, holding the corrected value?</p><ul><li><b>A.</b> Append each day's file</li><li><b>B.</b> Merge each day's file on encounter, test and round</li><li><b>C.</b> Overwrite each day's partition</li><li><b>D.</b> Append, then drop rows that are identical in every column</li></ul></li>
<li><p>A release from last March must be reproduced. The run log names the table but not the version, and the table is vacuumed weekly with seven days' retention. What is true?</p><ul><li><b>A.</b> Read the table as of last March's timestamp</li><li><b>B.</b> It cannot be rebuilt exactly from the table; only a kept snapshot of the release would prove it</li><li><b>C.</b> Rebuild from today's table: corrections only improve it</li><li><b>D.</b> Restore the table to March and rerun</li></ul></li>
<li><p>Rawdah's September laboratory partition fails its gate. The study's monthly report is due today. What does the pipeline do?</p><ul><li><b>A.</b> Stop the whole load until Rawdah re-sends</li><li><b>B.</b> Publish it with a warning in the log</li><li><b>C.</b> Publish the 35 partitions that passed, quarantine Rawdah's September, and flag September as two producers</li><li><b>D.</b> Divide the partition's values by 88.42 and publish</li></ul></li>
<li><p>A lazy query over the partitioned lake filters on month = '2025-09' and test_code = 'CREAT' and selects two columns. What does the plan let the scan skip?</p><ul><li><b>A.</b> Nothing: lazy only delays the same work</li><li><b>B.</b> Only the columns it does not select</li><li><b>C.</b> Every partition file whose month is not 2025-09, and every column the query does not need</li><li><b>D.</b> Every row group, because the test filter is applied after loading</li></ul></li>
<li><p>On 30 million rows an eager script peaks at 2.7 GB and the streaming lazy query at 112 MB, with the same result. What explains most of the difference?</p><ul><li><b>A.</b> The lazy query reads only the needed partitions and columns and aggregates batch by batch</li><li><b>B.</b> Polars compresses data in memory better than pandas</li><li><b>C.</b> The eager script has a bug that copies the data</li><li><b>D.</b> The streaming engine uses the disk instead of memory for everything</li></ul></li>
<li><p>A nightly load appends the day's file. It crashed after writing and the scheduler re-ran it. What do you find in the morning?</p><ul><li><b>A.</b> An error in the log and an empty day</li><li><b>B.</b> The day's rows twice, and no error anywhere</li><li><b>C.</b> The day's rows once, because the table rejects duplicates</li><li><b>D.</b> A corrupted table that cannot be read</li></ul></li>
<li><p>Which test proves that a daily load is idempotent?</p><ul><li><b>A.</b> The load finishes without errors twice in a row</li><li><b>B.</b> Row counts after one load and after two loads are within 1%</li><li><b>C.</b> The table has no null values after the second load</li><li><b>D.</b> A fingerprint of the table after loading every day once equals the fingerprint after loading every day twice</li></ul></li>
<li><p>The December figures sent to the board were built from the curated table. Since then, corrections were merged. The run log recorded version 1. How do you reproduce the board's figures?</p><ul><li><b>A.</b> Rebuild from today's table and subtract the corrections</li><li><b>B.</b> Read the table at version 1, rebuild the analysis and compare its fingerprint with the recorded one</li><li><b>C.</b> Restore last month's backup of the whole lake</li><li><b>D.</b> Re-run the analysis today: the figures are close enough</li></ul></li>
<li><p>Why can vacuuming a table with a short retention break reproducibility?</p><ul><li><b>A.</b> It deletes the data files that older versions still need</li><li><b>B.</b> It deletes the commit log, so versions lose their numbers</li><li><b>C.</b> It rewrites every file, changing all fingerprints</li><li><b>D.</b> It never does: vacuum only removes temporary files</li></ul></li>
<li><p>One of 36 laboratory partitions fails its range gate with 16.7% invalid results. Why gate per partition rather than per load?</p><ul><li><b>A.</b> Partitions are faster to check than the whole table</li><li><b>B.</b> A per-load gate cannot compute shares</li><li><b>C.</b> One bad delivery is quarantined while the other partitions are published</li><li><b>D.</b> Per-partition gates need no rules in the contract</li></ul></li>
<li><p>A monthly figure dips in September. With OpenLineage run events for every job, how do you find the cause?</p><ul><li><b>A.</b> Read the pipeline code line by line</li><li><b>B.</b> Walk the events backwards from the figure's dataset to the runs that wrote it and the partitions they read, then inspect September's partitions</li><li><b>C.</b> Ask each producer whether they changed anything</li><li><b>D.</b> Re-run the whole pipeline and see if the dip remains</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Synthesise and attack</h2>
<ol>
<li><p>Sidra corrects 15 creatinine results three days after sending them. Your daily load overwrites the delivery day's partition. What does the curated table hold afterwards?</p><ul><li><b>A.</b> The corrected values only</li><li><b>B.</b> Both the original and the corrected results: 15 duplicate keys</li><li><b>C.</b> Only the latest day, everything else overwritten</li><li><b>D.</b> An error: the keys collide</li></ul></li>
<li><p>The ministry asks for the number of readmissions per region and month, published on a public dashboard. Which option fits?</p><ul><li><b>A.</b> A synthetic file the ministry counts itself</li><li><b>B.</b> A de-identified extract</li><li><b>C.</b> A query service on the real data, with small counts protected before publication</li><li><b>D.</b> The exact counts from the real data, as they are</li></ul></li>
<li><p>A colleague fits one generator to patients and another to encounters, then assigns each synthetic encounter to a random synthetic patient. What breaks first?</p><ul><li><b>A.</b> Who comes back: stays per patient no longer depend on the patient's conditions</li><li><b>B.</b> Referential integrity: encounters with no patient</li><li><b>C.</b> The marginal distribution of each column</li><li><b>D.</b> The overall readmission rate</li></ul></li>
<li><p>A generator's report shows every column's distribution within 2% of the real one. The university asks whether its readmission model will work. What do you answer?</p><ul><li><b>A.</b> Yes: the distributions match</li><li><b>B.</b> Train on synthetic and test on the real training data</li><li><b>C.</b> Not known yet: train on synthetic, test on a real holdout, and compare the study's estimates</li><li><b>D.</b> No synthetic data can support a model</li></ul></li>
<li><p>A membership-inference test on a synthetic encounter table gives an AUC of 0.51; on the patient table, 0.88. What do you conclude?</p><ul><li><b>A.</b> The release is safe on average</li><li><b>B.</b> Patient attributes are coarse, so the 0.88 does not matter</li><li><b>C.</b> The encounter test failed and should be re-run</li><li><b>D.</b> The patient table leaks its training patients; the release fails until it is fixed</li></ul></li>
<li><p>A pharmacovigilance team needs the actual records of patients in a rare group (obstetric stays with chronic kidney disease). Which option fits?</p><ul><li><b>A.</b> A synthetic file of the whole study</li><li><b>B.</b> A de-identified extract of that group under an agreement, with minimum columns</li><li><b>C.</b> Monthly counts from a query service</li><li><b>D.</b> A synthetic file restricted to that group</li></ul></li>
<li><p>In a synthetic file, cells with fewer than 10 real encounters are off by 153% on average and cells with 50 or more by 10%. What follows for a request for exact small counts?</p><ul><li><b>A.</b> Use the synthetic file but round the counts</li><li><b>B.</b> Generate a larger synthetic file to reduce the error</li><li><b>C.</b> Use the synthetic file: 10% is acceptable</li><li><b>D.</b> Answer from the real data through a query service, protecting small counts before publication</li></ul></li>
<li><p>A university wants patient-level rows to develop a readmission model. Which plan states its residual risk honestly?</p><ul><li><b>A.</b> Send a synthetic file: synthetic data carries no risk</li><li><b>B.</b> Send the pseudonymised table: no names are in it</li><li><b>C.</b> A synthetic file for development, released only after per-table attacks pass, with the final model fitted on real data by the consortium</li><li><b>D.</b> Refuse: no option is safe</li></ul></li>
<li><p>Encounters are generated with one model and patients with another, and each encounter gets a random patient. What is lost?</p><ul><li><b>A.</b> How the number and kind of stays depend on the patient</li><li><b>B.</b> Referential integrity between the two tables</li><li><b>C.</b> The distribution of each encounter column</li><li><b>D.</b> Nothing, if both models are good</li></ul></li>
<li><p>In a conditional-tree generator, each value is copied from a random real row in the same leaf, and every leaf holds at least 25 real rows. What does raising the leaf size do?</p><ul><li><b>A.</b> Keeps relationships better and copies less</li><li><b>B.</b> Has no effect: the leaf only affects speed</li><li><b>C.</b> Increases copying, because larger leaves hold more real rows</li><li><b>D.</b> Copies less and blurs relationships the analysis needs</li></ul></li>
<li><p>A generator matches every column's distribution within 2%. Trained on its data, the readmission model scores AUC 0.665 on the real holdout; trained on real data, 0.706. What do you report?</p><ul><li><b>A.</b> Utility is high: the marginals match</li><li><b>B.</b> The file loses relationships the model relies on: a gap of 0.041 to the real model</li><li><b>C.</b> The test is wrong: AUC should be measured on the synthetic data</li><li><b>D.</b> Utility cannot be measured without the generator's code</li></ul></li>
<li><p>On real data the readmission risk ratio for heart failure is 2.07 (1.84 to 2.33). On a synthetic file it is 1.16 (0.96 to 1.41). What does this mean for the study?</p><ul><li><b>A.</b> The synthetic file is fine: both show heart failure raises risk</li><li><b>B.</b> The synthetic file is more private, so its estimate is better</li><li><b>C.</b> A study run on it would report no clear effect: the file is not fit for this analysis</li><li><b>D.</b> Average the two estimates</li></ul></li>
<li><p>A vendor's synthetic file gives a membership-inference AUC of 1.00 on encounters and 0.90 on patients. What do you tell the release board?</p><ul><li><b>A.</b> The file copies its training records: it fails, whatever it is called</li><li><b>B.</b> The attack is broken: a synthetic file cannot score 1.00</li><li><b>C.</b> It passes on average across tables</li><li><b>D.</b> Exact twins in coarse tables explain it; accept the file</li></ul></li>
<li><p>Why compare synthetic records with a holdout the generator never saw, rather than count exact matches with the training data?</p><ul><li><b>A.</b> Exact matches are too slow to compute</li><li><b>B.</b> The holdout is larger, so the test is more precise</li><li><b>C.</b> Exact matches are always zero in good synthetic data</li><li><b>D.</b> Chance matches happen for anyone; only members being closer than non-members shows memorisation</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Protect and decide</h2>
<ol>
<li><p>A new generator gives a TSTR AUC of 0.706, equal to the model trained on real data, and a membership AUC of 0.97 on encounters. What do you report?</p><ul><li><b>A.</b> The best generator so far: release it</li><li><b>B.</b> Acceptable on average across the two measures</li><li><b>C.</b> The attack is unreliable when utility is this high</li><li><b>D.</b> It copies its training encounters: it fails, and its perfect utility is part of the evidence</li></ul></li>
<li><p>An extract of patients with all their stays shows 4% of patients unique on sex, year of birth and region. What do you tell the release board?</p><ul><li><b>A.</b> The risk is low: 4%</li><li><b>B.</b> The 4% ignores the stays: with two known stays nearly every patient with two is unique</li><li><b>C.</b> Release only the first two stays of each patient and the risk is solved</li><li><b>D.</b> The study identifiers are pseudonyms, so uniqueness does not matter</li></ul></li>
<li><p>The ministry's dashboard recomputes every past month each night with fresh noise at ε = 1/12. The ledger is charged only once per month. What happens?</p><ul><li><b>A.</b> Privacy improves: the noise keeps changing</li><li><b>B.</b> Nothing: each month is still released at ε = 1/12</li><li><b>C.</b> Anyone who averages the nightly values recovers the true counts; the real spend grows every night</li><li><b>D.</b> The dashboard fails when the budget runs out</li></ul></li>
<li><p>Three hospital groups compute a pooled readmission count by secure aggregation and publish it. Which statement is true?</p><ul><li><b>A.</b> The aggregator never sees a site's count, but two sites together can compute the third's from the published total</li><li><b>B.</b> No one can learn anything about any site's count</li><li><b>C.</b> The published total is approximate because of the masks</li><li><b>D.</b> The aggregator must be trusted with every site's count</li></ul></li>
<li><p>The synthetic pair passes every attack. The university's request still lacks its academic authority's written approval. What does the board decide?</p><ul><li><b>A.</b> Approve: the file is safe, so the approval is a formality</li><li><b>B.</b> Reject the request permanently</li><li><b>C.</b> Conditional approval: nothing moves until the request comes through the institution with written approval, on the form</li><li><b>D.</b> Send a de-identified extract instead, which needs no approval</li></ul></li>
<li><p>An extract shows 4% of patients unique on sex, year of birth and region. With two known stays (month and diagnosis group) added, 97% of the patients who have two stays are unique. Which number describes the extract's risk?</p><ul><li><b>A.</b> 4%: the stays are not identifiers</li><li><b>B.</b> 97%, for an adversary who knows two stays: the sequence of stays is a quasi-identifier</li><li><b>C.</b> The average of the two</li><li><b>D.</b> Neither: pseudonymised data cannot be re-identified</li></ul></li>
<li><p>Truncating each patient's history to two stays dropped 24% of stays and raised uniqueness at two known stays from 21% to 47%. Why did the risk rise?</p><ul><li><b>A.</b> Truncation adds new information to each record</li><li><b>B.</b> The adversary knows more after truncation</li><li><b>C.</b> Other patients' later stays were the crowd that matched a person's known stays; removing them left fewer candidates</li><li><b>D.</b> It did not: the measurement must be wrong</li></ul></li>
<li><p>Monthly counts of readmitted stays are to be released with Laplace noise. One patient can have three readmitted stays in a month. What should be done first?</p><ul><li><b>A.</b> Bound each patient's contribution, for example by counting readmitted patients, and calibrate the noise to that bound</li><li><b>B.</b> Use the same noise as for a count where each person adds one</li><li><b>C.</b> Remove patients with more than one stay</li><li><b>D.</b> Add noise only to months with such patients</li></ul></li>
<li><p>A yearly budget of ε = 1 is split over twelve monthly counts with Laplace noise. What is the expected absolute error of one month, and how do you halve it?</p><ul><li><b>A.</b> 1 patient; halve it by rounding</li><li><b>B.</b> 12 patients; halve it by adding a second noisy release and averaging, at no charge</li><li><b>C.</b> 12 patients; halve it by publishing only the months with large counts</li><li><b>D.</b> 12 patients; halve it with twice the budget per month, or with half as many releases</li></ul></li>
<li><p>A dashboard recomputes last month's count every night with fresh noise, but the ledger records only the first release. What is wrong?</p><ul><li><b>A.</b> Nothing: each copy has the same ε</li><li><b>B.</b> Each copy is a release; averaging them recovers the true count, so the real spend grows nightly</li><li><b>C.</b> The counts will drift upwards</li><li><b>D.</b> The ledger will refuse after twelve nights</li></ul></li>
<li><p>Three hospital groups pool a readmission count by secure aggregation and publish the exact total. Sidra and Ufuq compare notes. What can they learn?</p><ul><li><b>A.</b> Nothing: secure aggregation hides every input</li><li><b>B.</b> Only an approximate value for Rawdah</li><li><b>C.</b> Rawdah's exact count: the total minus their own</li><li><b>D.</b> Each patient's record at Rawdah</li></ul></li>
<li><p>In a pairwise-mask protocol, one site drops out after agreeing its masks. The others reveal the masks they shared with it so the sum can be recovered. What must the aggregator then refuse?</p><ul><li><b>A.</b> A late masked value from the dropped site</li><li><b>B.</b> Any further values from the surviving sites</li><li><b>C.</b> Publishing the recovered sum</li><li><b>D.</b> Nothing: recovery has no consequence</li></ul></li>
<li><p>A professor emails a request for all record-level columns, for a thesis, with institutional approval 'to follow'. The synthetic pair passes every attack. What does the release board decide?</p><ul><li><b>A.</b> Approve the synthetic pair now: it is safe</li><li><b>B.</b> Send a de-identified extract, which needs no approval</li><li><b>C.</b> Reject the request permanently</li><li><b>D.</b> Conditional approval: resubmission through the institution with written approval, on the form, with the minimum necessary data</li></ul></li>
<li><p>Which line belongs in a release decision record as a residual risk?</p><ul><li><b>A.</b> 'Data will be handled responsibly'</li><li><b>B.</b> 'Membership AUC 0.55 on patients and 0.51 on encounters, under the board's threshold of 0.60; the file remains derived from personal data'</li><li><b>C.</b> 'Synthetic data carries no risk'</li><li><b>D.</b> 'The risk is low'</li></ul></li>
</ol>
</section>

proves only the format while the space stays small enough to enumerate","Moves the identifier, not the risk: the consortium would then hold identities",""],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-hash","title":"Safe to send?"},"level":null,"pool":"checkpoint"},{"id":"check-breaking-q1","type":"single","prompt":"Rawdah plans to rename weight_lb to weight and send kilograms. Its engineer calls it a minor clean-up. How do you classify it?","options":[{"key":"A","text":"Minor: one column, same data"},{"key":"B","text":"Breaking: a rename and a unit change; major version, notice and a parallel run"},{"key":"C","text":"Additive: the new unit is better"},{"key":"D","text":"Whatever Rawdah decides: it owns the data"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Every consumer that reads weight_lb breaks, and any that converts pounds now gets wrong numbers. Both are breaking under the policy.","misconceptions":["Judges a change by its size in the code, not by its effect on consumers","","Assumes the unit change is good news, but any consumer converting pounds now divides kilograms","Lets the producer's own judgement replace the agreed policy"],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-breaking","title":"Minor or major?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Rawdah tells you that from next month its weight column will hold kilograms, under the same name. What do you do first?","options":[{"key":"A","text":"Classify it under the policy as a breaking unit change: new major version, notice, a parallel run"},{"key":"B","text":"Thank them and remove the unit clause from the contract the same day"},{"key":"C","text":"Add an if-statement on the date in the study's pipeline"},{"key":"D","text":"Nothing: the range rule will catch any problem"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Same name, new unit is the change no schema diff shows. The policy treats it as breaking so that every consumer moves together.","misconceptions":["","Assumes a change towards the standard unit cannot hurt, when every consumer that converts pounds now divides kilograms","Moves the fix into one consumer's code where the other consumers never see it","Trusts a range rule that pounds and kilograms both pass"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Yesterday in one decision"},"level":null,"pool":"checkpoint"},{"id":"check-lazy-q1","type":"single","prompt":"Your lazy query on the lake is fast but its peak memory is the same as the eager script's. Which change most likely helps?","options":[{"key":"A","text":"Rewrite the lake as one unpartitioned Parquet file, so fewer files are opened"},{"key":"B","text":"Run it on more CPU cores"},{"key":"C","text":"Collect the labs table first, then filter it"},{"key":"D","text":"Read the plan: put the month and test filters on the scan and select only needed columns"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Memory follows what is read. If the plan shows a full projection or no selection on the scan, the query reads everything; pushing filters and columns down is what saves memory.","misconceptions":["Removes the partitions that let the scan skip whole files, so even more is read","Adds threads to a problem of bytes read","Caches the very data that should never have been loaded",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-lazy","title":"Where the filter goes"},"level":null,"pool":"checkpoint"},{"id":"check-idempotent-q1","type":"single","prompt":"Sidra's delivery on day 5 corrects results first delivered on day 2. Which load leaves exactly one row per result, holding the corrected value?","options":[{"key":"A","text":"Append each day's file"},{"key":"B","text":"Merge each day's file on encounter, test and round"},{"key":"C","text":"Overwrite each day's partition"},{"key": g in the log"},{"key":"C","text":"Publish the 35 partitions that passed, quarantine Rawdah's September, and flag September as two producers"},{"key":"D","text":"Divide the partition's values by 88.42 and publish"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Gating per partition keeps a bad delivery from blocking good ones, and the flag keeps the figure honest about what it contains.","misconceptions":["Stops good data from two producers and eleven months because of one partition","Publishes known bad values into the study","","Repairs a producer's data downstream without the producer confirming the cause"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-gates","title":"One partition fails"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Sidra corrects 15 creatinine results three days after sending them. Your daily load overwrites the delivery day's partition. What does the curated table hold afterwards?","options":[{"key":"A","text":"The corrected values only"},{"key":"B","text":"Both the original and the corrected results: 15 duplicate keys"},{"key":"C","text":"Only the latest day, everything else overwritten"},{"key":"D","text":"An error: the keys collide"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Partition overwrite makes a re-run safe but files the correction under the day it arrived. Only a merge on the business key replaces what it corrects: Lab 2.2 counted 15 duplicate keys before the merge and 0 after.","misconceptions":["Assumes overwrite by day reaches rows that belong to an earlier day","","Confuses a predicate overwrite with a full table rewrite","Expects the table to enforce a key it was never given"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Yesterday in one decision"},"level":null,"pool":"checkpoint"},{"id":"check-options-q1","type":"single","prompt":"The ministry asks for the number of readmissions per region and month, published on a public dashboard. Which option fits?","options":[{"key":"A","text":"A synthetic file the ministry counts itself"},{"key":"B","text":"A de-identified extract"},{"key":"C","text":"A query service on the real data, with small counts protected before publication"},{"key":"D","text":"The exact counts from the real data, as they are"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Counts must come from the real data; but a public count of 1 or 2 can identify someone, so outputs are protected too. Day 4 session 2 does this with a privacy budget.","misconceptions":["Gives counts that are model draws, wrong most in the small cells a dashboard shows","Hands patient-level rows to someone who needs only totals","","Treats publication as private because no rows leave"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-options","title":"Pick the option"},"level":null,"pool":"checkpoint"},{"id":"check-relation-q1","type":"single","prompt":"A colleague fits one generator to patients and another to encounters, then assigns each synthetic encounter to a random synthetic patient. What breaks first?","options":[{"key":"A","text":"Who comes back: stays per patient no longer depend on the patient's conditions"},{"key":"B","text":"Referential integrity: encounters with no patient"},{"key":"C","text":"The marginal distribution of each column"},{"key":"D","text":"The overall readmission rate"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Random parents keep every column and every link, but heart-failure patients get 2.10 stays instead of 3.06, and some patients get none.","misconceptions":["","Integrity can hold perfectly while the relation is lost","Each table on its own is generated as before","Assumes the outcome's average changes when only its link to patients is lost"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-relation","title":"Where the child lide":{"deck":"day3","id":"check-attack","title":"Reading an attack"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"A new generator gives a TSTR AUC of 0.706, equal to the model trained on real data, and a membership AUC of 0.97 on encounters. What do you report?","options":[{"key":"A","text":"The best generator so far: release it"},{"key":"B","text":"Acceptable on average across the two measures"},{"key":"C","text":"The attack is unreliable when utility is this high"},{"key":"D","text":"It copies its training encounters: it fails, and its perfect utility is part of the evidence"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The vendor's file showed exactly this pattern: zero fidelity gap, the real AUC, and members found with certainty.","misconceptions":["Reads perfect utility as success without the attack that contradicts it","Averages a leaking table with a safe one","Blames the attack for the result it was built to detect",""],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Yesterday in one decision"},"level":null,"pool":"checkpoint"},{"id":"check-longitudinal-q1","type":"single","prompt":"An extract of patients with all their stays shows 4% of patients unique on sex, year of birth and region. What do you tell the release board?","options":[{"key":"A","text":"The risk is low: 4%"},{"key":"B","text":"The 4% ignores the stays: with two known stays nearly every patient with two is unique"},{"key":"C","text":"Release only the first two stays of each patient and the risk is solved"},{"key":"D","text":"The study identifiers are pseudonyms, so uniqueness does not matter"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An adversary's knowledge of stays makes the sequence a quasi-identifier: 96.6% unique at two known stays.","misconceptions":["Reports the single-table estimate for a longitudinal release","","Assumes removing stays always lowers risk","Treats pseudonyms as protection against someone who knows the person"],"lo":["LO3"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-longitudinal","title":"Which number to report"},"level":null,"pool":"checkpoint"},{"id":"check-budget-q1","type":"single","prompt":"The ministry's dashboard recomputes every past month each night with fresh noise at ε = 1/12. The ledger is charged only once per month. What happens?","options":[{"key":"A","text":"Privacy improves: the noise keeps changing"},{"key":"B","text":"Nothing: each month is still released at ε = 1/12"},{"key":"C","text":"Anyone who averages the nightly values recovers the true counts; the real spend grows every night"},{"key":"D","text":"The dashboard fails when the budget runs out"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Every noisy copy is a release. A year of copies brought January within two patients of the truth.","misconceptions":["Thinks fresh noise each night adds protection","Assumes the budget is a property of the query rather than of the releases","","Confuses an accounting error with a software error"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-budget","title":"The nightly dashboard"},"level":null,"pool":"checkpoint"},{"id":"check-secagg-q1","type":"single","prompt":"Three hospital groups compute a pooled readmission count by secure aggregation and publish it. Which statement is true?","options":[{"key":"A","text":"The aggregator never sees a site's count, but two sites together can compute the third's from the published total"},{"key":"B","text":"No one can learn anything about any site's count"},{"key":"C","text":"The published total is approximate because of the masks"},{"key":"D","text":"The aggregator must be trusted with every site's count"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The masks cancel exactly: the output is the true total, and subtraction by those who know the other inputs reveals the last one.","misconceptions":["","Extends protection of the inputs to the published output","Confuses masking with noise","Assumes the protocol needs a trusted party to see values"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-secagg","title":"What the protocol protects"},"level":null,"pool":"checkpoint"},{"id":"check-decision-q1","type":"single","prompt":"The synthetic pair passes every attack. The university's request still lacks its academic authority's written approval. What does the board decide?","options":[{"key":"A","text":"Approve: the file is safe, so the approval is a formality"},{"key":"B","text":"Reject the request permanently"},{"key":"C","text":"Conditional approval: nothing moves until the request comes through the institution with written approval, on the form"},{"key":"D","text":"Send a de-identified extract instead, which needs no approval"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An academic applicant applies through the institution with written approval of its academic authority; the method decides what is released once the request is complete.","misconceptions":["Lets measured safety replace a requirement the rules place on the applicant","Ends the request when its gaps can be fixed","","Sends real records to a requester who has not met the rules"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-decision","title":"The decision"},"level":null,"pool":"checkpoint"},{"id":"q-d1-units-ratio","type":"single","prompt":"Sidra's creatinine median is 89.9 and Ufuq's is 1.00. Both columns are numeric and complete. What is the most likely explanation, and what follows?","options":[{"key":"A","text":"Ufuq's patients have healthier kidneys; pool the values as they are"},{"key":"B","text":"Ufuq reports mg/dL; confirm with Ufuq and write the factor 88.42 into the contract"},{"key":"C","text":"One of the columns is corrupt; drop creatinine from the study"},{"key":"D","text":"The ept it and note the gap in the study's limitations"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Freshness is a contract clause: a delivery that stops early biases pooled rates, so the gate blocks it and the producer sends it again.","misconceptions":["","Treats completeness of a period as a property of single rows","Invents data to hide a gap","Lets a known bias into the pooled rate when a new delivery is possible"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-what-in-contract","type":"single","prompt":"Which clause belongs in the shared contract rather than in one consumer's pipeline code?","options":[{"key":"A","text":"The colour scheme of the study's dashboard"},{"key":"B","text":"The study's model settings"},{"key":"C","text":"Ufuq's mapping of discharge codes 1 to 4 onto HOME, TRANSFER, DIED and LAMA"},{"key":"D","text":"The name of the notebook that reads the feed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Code maps define what the producer's values mean; written in the contract, every consumer applies the same meaning and a change to it is versioned.","misconceptions":["Mixes a consumer's presentation choice with the feed's meaning","Puts an analysis choice into the producers' agreement","","Confuses a consumer's file with the contract"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d1-key-custody","type":"single","prompt":"Producers will send HMAC-SHA-256 of the normalised national identifier. Who should hold the key?","options":[{"key":"A","text":"The consortium's analysts, so they can check matches"},{"key":"B","text":"Nobody: generate it once and delete it"},{"key":"C","text":"Each producer its own key"},{"key":"D","text":"A linkage unit outside the analysis team, which gives the producers one key for this project"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The producers need one shared key to produce matching pseudonyms; keeping it away from the analysts keeps the pseudonyms irreversible for them, and a key per project prevents joins across projects.","misconceptions":["Gives the people who see the data the means to re-identify it","Producers need the same key to compute matching pseudonyms","Different keys give different pseudonyms, so nothing links",""],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-linkage-report","type":"single","prompt":"Adding a second linkage key on name, birth date and sex raised recall from 0.993 to 1.000 and lowered precision from 1.000 to 0.988. What should you report?","options":[{"key":"A","text":"Only the recall: the study needs every readmission"},{"key":"B","text":"Both numbers with counts: 14 pairs recovered, 24 strangers merged, and a proposed rule to filter them"},{"key":"C","text":"Only precision: wrong links are unacceptable"},{"key":"D","text":"Neither: the truth file is synthetic, so the numbers mean nothing"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Linkage makes two errors that bias the study in different directions; the decision needs both, as counts as well as rates.","misconceptions":["Hides the merged histories the second key created","","Hides the readmissions the first key misses","Rejects measurement because the data is synthetic, when the planted truth is exactly what makes it measurable"],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d1-hidden-unit","type":"single","prompt":"Ufuq replaces column Creatinine_mgdl by Creatinine, whose median is 89.3 where the old one was 1.00. How does the policy classify it?","options":[{"key":"A","text":"Additive: a new column appeared"},{"key":"B","text":"No change: the same measurement under a clearer name"},{"key":"C","text":"Breaking: a renamed column and a unit change; a new major version"},{"key":"D","text":"Breaking only if the data protection officer objects"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The values show the same measurement in a new unit: a rename and a unit change, both breaking, so the contract moves to a new major version.","misconceptions":["Reads the schema diff and not the values","Misses the unit change hidden by the rename","","Confuses the approvers with the classification"],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d1-new-code","type":"single","prompt":"Why is a new value in a closed code set (Ufuq's discharge code 5) treated as breaking?","options":[{"key":"A","text":"The study's mapping does not know it, so those rows become null or drop out"},{"key":"B","text":"Any change to a producer's system is breaking"},{"key":"C","text":"New codes always mean worse data quality"},{"key":"D","text":"It is not: new values are always additive"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A consumer with a closed list cannot place the new code, so its rows silently leave the analysis; the producer must announce it.","misconceptions":["","Over-classifies changes that consumers do not notice","Judges the value instead of its effect on consumers","Ignores that consumers with closed lists lose the rows"],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-pushdown","type":"single","prompt":"A lazy query over the partitioned lake filters on month = '2025-09' and test_code = 'CREAT' and selects two columns. What does the plan let the scan skip?","options":[{"key":"A","text":"Nothing: lazy only delays the same work"},{"key":"B","text":"Only the columns it does not select"},{"key":"C","text":"Every partition file whose month is not 2025-09, and every column the query does not need"},{"key":"D","text":"Every row group, because the test filter is applied after loading"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Hive partition values prune whole files and projection pushdown reads only the needed columns; the plan shows both on the scan.","misconceptions":["Confuses deferring work with reducing it","Forgets partition pruning by the folder names","","Assumes filters run after the scan instead of inside it"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-memory","type":"single","prompt":"On 30 million rows an eager script peaks at 2.7 GB and the streaming lazy query at 112 MB, with the same result. What explains most of the difference?","options":[{"key":"A","text":"The lazy query reads only the needed partitions and columns and aggregates batch by batch"},{"key":"B","text":"Polars compresses data in memory better than pandas"},{"key":"C","text":"The eager script has a bug that copies the data"},{"key":"D","text":"The streaming engine uses the disk instead of memory for everything"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The eager script loads every row and column before filtering; the lazy plan reads less and the streaming engine never holds the whole result of the scan.","misconceptions":["","Credits the library instead of the amount of data read","Assumes a defect when the design reads everything by intent","Confuses batching with spilling all data to disk"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-append-retry","type":"single","prompt":"A nightly load appends the day's file. It crashed after writing and the scheduler re-ran it. What do you find in the morning?","options":[{"key":"A","text":"An error in the log and an empty day"},{"key":"B","text":"The day's rows twice, and no error anywhere"},{"key":"C","text":"The day's rows once, because the table rejects duplicates"},{"key":"D","text":"A corrupted table that cannot be read"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An append is not idempotent: the second run adds the same rows again, and nothing in the file or the table complains.","misconceptions":["Expects a re-run to fail loudly","","Assumes a table enforces a key it was never given","Confuses a duplicated write with a broken one"],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-proof","type":"single","prompt":"Which test proves that a daily load is idempotent?","options":[{"key":"A","text":"The load finishes without errors twice in a row"},{"key":"B","text":"Row counts after one load and after two loads are within 1%"},{"key":"C","text":"The table has no null values after the second load"},{"key":"D","text":"A fingerprint of the table after loading every day once equals the fingerprint after loading every day twice"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Identical output when a day is re-run is shown by equal content fingerprints that ignore row order and file layout.","misconceptions":["Takes absence of errors as proof of identical content","Accepts a tolerance where identity is required","Checks a quality property instead of sameness",""],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d2-time-travel","type":"single","prompt":"The December figures sent to the board were built from the curated table. Since then, corrections were merged. The run log recorded version 1. How do you reproduce the board's figures?","options":[{"key":"A","text":"Rebuild from today's table and subtract the corrections"},{"key":"B","text":"Read the table at version 1, rebuild the analysis and compare its fingerprint with the recorded one"},{"key":"C","text":"Restore last month's backup of the whole lake"},{"key":"D","text":"Re-run the analysis today: the figures are close enough"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Time travel to the recorded version rebuilds exactly what was read, and the fingerprint proves the rebuild is identical.","misconceptions":["Reverses changes by hand instead of reading the old version","","Uses a coarse backup when the table keeps its own versions","Accepts different numbers as a reproduction"],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-vacuum","type":"single","prompt":"Why can vacuuming a table with a short retention break reproducibility?","options":[{"key":"A","text":"It deletes the data files that older versions still need"},{"key":"B","text":"It deletes the commit log, so versions lose their numbers"},{"key":"C","text":"It rewrites every file, changing all fingerprints"},{"key":"D","text":"It never does: vacuum only removes temporary files"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Vacuum removes files no longer referenced by the current version; time travel to an older version then fails for lack of its files.","misconceptions":["","Confuses removing data files with removing the log","Assumes vacuum rewrites current data","Ignores that old versions' files are exactly what vacuum removes"],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d2-per-partition","type":"single","prompt":"One of 36 laboratory partitions fails its range gate with 16.7% invalid results. Why gate per partition rather than per load?","options":[{"key":"A","text":"Partitions are faster to check than the whole table"},{"key":"B","text":"A per-load gate cannot compute shares"},{"key":"C","text":"One bad delivery is quarantined while the other partitions are published"},{"key":"D","text":"Per-partition gates need no rules in the contract"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Blocking per partition stops only the failing producer and month; the rest of the data reaches the study, with the gap flagged.","misconceptions":["Picks a speed reason for a decision about blocking","Assumes the rule cannot be computed on a whole load","","Thinks the gate replaces the contract's rules"],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d2-lineage","type":"single","prompt":"A monthly figure dips in September. With OpenLineage run events for every job, how do you find the cause?","options":[{"key":"A","text":"Read the pipeline code line by line"},{"key":"B","text":"Walk the events backwards from the figure's dataset to the runs that wrote it and the partitions they read, then inspect September's partitions"},{"key":"C","text":"Ask each producer whether they changed anything"},{"key":"D","text":"Re-run the whole pipeline and see if the dip remains"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Lineage events record inputs and outputs per run, so the upstream walk narrows the dip to a handful of partitions whose data can be checked.","misconceptions":["Ignores the events that record what each run actually read","","Starts with people instead of the evidence that narrows the question","Repeats the problem without locating it"],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-rare-group","type":"single","prompt":"A pharmacovigilance team needs the actual records of patients in a rare group (obstetric stays with chronic kidney disease). Which option fits?","options":[{"key":"A","text":"A synthetic file of the whole study"},{"key":"B","text":"A de-identified extract of that group under an agreement, with minimum columns"},{"key":"C","text":"Monthly counts from a query service"},{"key":"D","text":"A synthetic file restricted to that group"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only real records serve case review; a synthetic file loses or invents rare cells. The extract is still personal data, so it needs an agreement and controls.","misconceptions":["Expects a generator to reproduce the members of a rare group","","Gives totals to a team that must review cases","Assumes conditioning on a rare group makes its records real"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-small-counts","type":"single","prompt":"In a synthetic file, cells with fewer than 10 real encounters are off by 153% on average and cells with 50 or more by 10%. What follows for a request for exact small counts?","options":[{"key":"A","text":"Use the synthetic file but round the counts"},{"key":"B","text":"Generate a larger synthetic file to reduce the error"},{"key":"C","text":"Use the synthetic file: 10% is acceptable"},{"key":"D","text":"Answer from the real data through a query service, protecting small counts before publication"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Synthetic counts are draws from a model and are worst exactly where small counts matter; exact counts come from the real data, with output protection.","misconceptions":["Treats a model's draw as a count with rounding error","Expects more draws from the same model to recover exact rare counts","Reads the large-cell error as if it applied to small cells",""],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d3-university-plan","type":"single","prompt":"A university wants patient-level rows to develop a readmission model. Which plan states its residual risk honestly?","options":[{"key":"A","text":"Send a synthetic file: synthetic data carries no risk"},{"key":"B","text":"Send the pseudonymised table: no names are in it"},{"key":"C","text":"A synthetic file for development, released only after per-table attacks pass, with the final model fitted on real data by the consortium"},{"key":"D","text":"Refuse: no option is safe"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The synthetic file serves development; its privacy is shown by attacks and its utility by the gap to the real model, which is why the final fit stays on real data.","misconceptions":["Takes the word synthetic as a privacy guarantee","Forgets that pseudonymised data stays personal data","","Ignores options whose risk can be measured and controlled"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d3-relation","type":"single","prompt":"Encounters are generated with one model and patients with another, and each encounter gets a random patient. What is lost?","options":[{"key":"A","text":"How the number and kind of stays depend on the patient"},{"key":"B","text":"Referential integrity between the two tables"},{"key":"C","text":"The distribution of each encounter column"},{"key":"D","text":"Nothing, if both models are good"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The child count and the children's values depend on the parent; random parents keep every column and lose the relation (stays per heart-failure patient fell from 3.06 to 2.10).","misconceptions":["","Thinks random assignment creates orphans, when every encounter still has a patient","Expects the separate models to change their own marginals","Assumes good tables make a good relation"],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-leaf","type":"single","prompt":"In a conditional-tree generator, each value is copied from a random real row in the same leaf, and every leaf holds at least 25 real rows. What does raising the leaf size do?","options":[{"key":"A","text":"Keeps relationships better and copies less"},{"key":"B","text":"Has no effect: the leaf only affects speed"},{"key":"C","text":"Increases copying, because larger leaves hold more real rows"},{"key":"D","text":"Copies less and blurs relationships the analysis needs"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A larger leaf draws each value from a broader context: less like any one person, and less faithful to the relations between columns.","misconceptions":["Assumes privacy and utility move together","Misses that the leaf is the context a value is drawn from","Confuses more rows to draw from with closer copies",""],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d3-tstr","type":"single","prompt":"A generator matches every column's distribution within 2%. Trained on its data, the readmission model scores AUC 0.665 on the real holdout; trained on real data, 0.706. What do you report?","options":[{"key":"A","text":"Utility is high: the marginals match"},{"key":"B","text":"The file loses relationships the model relies on: a gap of 0.041 to the real model"},{"key":"C","text":"The test is wrong: AUC should be measured on the synthetic data"},{"key":"D","text":"Utility cannot be measured without the generator's code"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Train-on-synthetic, test-on-real measures fitness for the study; the gap to the real model is the evidence, whatever the fidelity scores say.","misconceptions":["Takes column fidelity as fitness for the analysis","","Scores the model on the data it was trained on","Thinks utility depends on the method rather than on the output"],"lo":["LO3"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d3-estimate","type":"single","prompt":"On real data the readmission risk ratio for heart failure is 2.07 (1.84 to 2.33). On a synthetic file it is 1.16 (0.96 to 1.41). What does this mean for the study?","options":[{"key":"A","text":"The synthetic file is fine: both show heart failure raises risk"},{"key":"B","text":"The synthetic file is more private, so its estimate is better"},{"key":"C","text":"A study run on it would report no clear effect: the file is not fit for this analysis"},{"key":"D","text":"Average the two estimates"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Utility is judged on the analysis's own estimate; this file shrinks the effect towards 1 and would change the study's conclusion.","misconceptions":["Ignores that one interval includes no effect","Confuses privacy with correctness of an estimate","","Combines a biased estimate with an unbiased one"],"lo":["LO3"],"day":3,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d3-vendor","type":"single","prompt":"A vendor's synthetic file gives a membership-inference AUC of 1.00 on encounters and 0.90 on patients. What do you tell the release board?","options":[{"key":"A","text":"The file copies its training records: it fails, whatever it is called"},{"key":"B","text":"The attack is broken: a synthetic file cannot score 1.00"},{"key":"C","text":"It passes on average across tables"},{"key":"D","text":"Exact twins in coarse tables explain it; accept the file"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Members are found with certainty: the file reproduces real stays under new identifiers. A release passes only if every table passes.","misconceptions":["","Trusts the label over the measurement","Averages away the weakest table an attacker would use","Forgets that chance matches affect non-members equally"],"lo":["LO3"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d3-holdout","type":"single","prompt":"Why compare synthetic records with a holdout the generator never saw, rather than count exact matches with the training data?","options":[{"key":"A","text":"Exact matches are too slow to compute"},{"key":"B","text":"The holdout is larger, so the test is more precise"},{"key":"C","text":"Exact matches are always zero in good synthetic data"},{"key":"D","text":"Chance matches happen for anyone; only members being closer than non-members shows memorisation"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"On coarse attributes about a fifth of never-seen patients have exact twins; the leak is the difference between members and non-members.","misconceptions":["Gives a speed reason for a question of evidence","Misremembers the role of the holdout","Expects no chance matches on coarse attributes",""],"lo":["LO3"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-sequences","type":"single","prompt":"An extract shows 4% of patients unique on sex, year of birth and region. With two known stays (month and diagnosis group) added, 97% of the patients who have two stays are unique. Which number describes the extract's risk?","options":[{"key":"A","text":"4%: the stays are not identifiers"},{"key":"B","text":"97%, for an adversary who knows two stays: the sequence of stays is a quasi-identifier"},{"key":"C","text":"The average of the two"},{"key":"D","text":"Neither: pseudonymised data cannot be re-identified"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Risk depends on what an adversary may know; for longitudinal records, stays a relative or colleague knows single out almost everyone with them.","misconceptions":["Treats only demographic columns as quasi-identifiers","","Averages two answers to different questions","Forgets that pseudonymised data stays personal data"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d4-truncation","type":"single","prompt":"Truncating each patient's history to two stays dropped 24% of stays and raised uniqueness at two known stays from 21% to 47%. Why did the risk rise?","options":[{"key":"A","text":"Truncation adds new information to each record"},{"key":"B","text":"The adversary knows more after truncation"},{"key":"C","text":"Other patients' later stays were the crowd that matched a person's known stays; removing them left fewer candidates"},{"key":"D","text":"It did not: the measurement must be wrong"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Uniqueness counts candidates who share what is known; removing stays from everyone removes candidates, so a lever must be measured, not assumed.","misconceptions":["Assumes risk can only rise by adding data","Moves the change to the adversary instead of the data","","Assumes a protective-sounding lever cannot backfire"],"lo":["LO3"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d4-bound","type":"single","prompt":"Monthly counts of readmitted stays are to be released with Laplace noise. One patient can have three readmitted stays in a month. What should be done first?","options":[{"key":"A","text":"Bound each patient's contribution, for example by counting readmitted patients, and calibrate the noise to that bound"},{"key":"B","text":"Use the same noise as for a count where each person adds one"},{"key":"C","text":"Remove patients with more than one stay"},{"key":"D","text":"Add noise only to months with such patients"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The noise scale is the contribution bound divided by ε; a statistic in which each patient moves each count by at most 1 keeps the guarantee for patients.","misconceptions":["","Ignores that a person can move the count by more than one","Changes the population instead of bounding the contribution","Reveals which months contain them"],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-error","type":"single","prompt":"A yearly budget of ε = 1 is split over twelve monthly counts with Laplace noise. What is the expected absolute error of one month, and how do you halve it?","options":[{"key":"A","text":"1 patient; halve it by rounding"},{"key":"B","text":"12 patients; halve it by adding a second noisy release and averaging, at no charge"},{"key":"C","text":"12 patients; halve it by publishing only the months with large counts"},{"key":"D","text":"12 patients; halve it with twice the budget per month, or with half as many releases"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With bound 1 and ε = 1/12 per month the Laplace scale, and the expected absolute error, is 12; halving it needs twice the ε per release.","misconceptions":["Confuses ε with the noise scale","Thinks averaged re-releases are free","Turns the choice of months into a disclosure",""],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-rerelease","type":"single","prompt":"A dashboard recomputes last month's count every night with fresh noise, but the ledger records only the first release. What is wrong?","options":[{"key":"A","text":"Nothing: each copy has the same ε"},{"key":"B","text":"Each copy is a release; averaging them recovers the true count, so the real spend grows nightly"},{"key":"C","text":"The counts will drift upwards"},{"key":"D","text":"The ledger will refuse after twelve nights"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Sequential composition adds up every release; store and serve the first noisy value, or charge every recomputation.","misconceptions":["Treats the budget as a property of the query rather than of the releases","","Expects bias from unbiased noise","Forgets that the ledger was never charged"],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d4-subtraction","type":"single","prompt":"Three hospital groups pool a readmission count by secure aggregation and publish the exact total. Sidra and Ufuq compare notes. What can they learn?","options":[{"key":"A","text":"Nothing: secure aggregation hides every input"},{"key":"B","text":"Only an approximate value for Rawdah"},{"key":"C","text":"Rawdah's exact count: the total minus their own"},{"key":"D","text":"Each patient's record at Rawdah"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The masks cancel exactly; anyone who knows all inputs but one can subtract. Outputs need their own protection: minimum sites and cells, or noise.","misconceptions":["Extends protection of inputs to the output","Confuses masks with noise","","Overstates what an aggregate reveals"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-d4-dropout","type":"single","prompt":"In a pairwise-mask protocol, one site drops out after agreeing its masks. The others reveal the masks they shared with it so the sum can be recovered. What must the aggregator then refuse?","options":[{"key":"A","text":"A late masked value from the dropped site"},{"key":"B","text":"Any further values from the surviving sites"},{"key":"C","text":"Publishing the recovered sum"},{"key":"D","text":"Nothing: recovery has no consequence"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With its masks revealed, the dropped site's late value could be unmasked alone; the protocol refuses it once recovery starts.","misconceptions":["","Blocks the sites whose values are still protected","Treats recovery as a breach of the total","Misses that the dropped site's masks are now known"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-d4-decision","type":"single","prompt":"A professor emails a request for all record-level columns, for a thesis, with institutional approval 'to follow'. The synthetic pair passes every attack. What does the release board decide?","options":[{"key":"A","text":"Approve the synthetic pair now: it is safe"},{"key":"B","text":"Send a de-identified extract, which needs no approval"},{"key":"C","text":"Reject the request permanently"},{"key":"D","text":"Conditional approval: resubmission through the institution with written approval, on the form, with the minimum necessary data"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The secondary-use rules require an academic applicant to apply through the institution with written approval and to ask for the minimum necessary; the method applies once the request is complete.","misconceptions":["Lets measured safety replace requirements placed on the applicant","Thinks an extract escapes the rules for personal data","Ends a request whose gaps can be fixed",""],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"q-d4-residual","type":"single","prompt":"Which line belongs in a release decision record as a residual risk?","options":[{"key":"A","text":"'Data will be handled responsibly'"},{"key":"B","text":"'Membership AUC 0.55 on patients and 0.51 on encounters, under the board's threshold of 0.60; the file remains derived from personal data'"},{"key":"C","text":"'Synthetic data carries no risk'"},{"key":"D","text":"'The risk is low'"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A residual risk states what was measured, against which threshold, and what remains; the board and the data protection officer can then check it.","misconceptions":["Writes an intention that cannot be checked","","Takes the label as the evidence","States a conclusion without the measurement"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"}]}</script>
